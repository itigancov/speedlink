  openMode:
    smart:
      title: Smart switch
      short: Smart
      description: Jumps to the tab if it’s already open, otherwise opens a new one.
    new:
      title: New tab
      short: New tab
      description: Always opens a fresh tab next to the current one.
    this:
      title: This tab
      short: This tab
      description: Replaces the page you’re looking at.
    bg:
      title: Background tab
      short: Background
      description: Opens quietly and you stay where you are.
  tabMatch:
    exact:
      title: This exact link
      hint: Only a tab with exactly $1 is reused.
    page:
      title: This page
      hint: "Reuses a tab on $1, ignoring ?query and #anchors."
    site:
      title: Any page of the site
      hint: Reuses any tab on $1 — e.g. a video you left open.
