extName: SpeedLink
extDescription: Open any site with one keyboard shortcut.
commandToggleOverlay: Show or pin the shortcut overlay
platform:
  mac:
    trigger: ⌥ Option
    triggerWord: Option
    chord: ⌥$1
    plusKey: ⌥ + key
    fn: fn
    control: ⌃
    option: ⌥ option
    command: ⌘
  other:
    trigger: Alt
    triggerWord: Alt
    chord: Alt+$1
    plusKey: Alt + key
    control: Ctrl
    alt: Alt
  space: space
keyCap:
  assigned: "$1 $2: $3"
  free: "$1 $2: free"
  reserved: "$1 $2: reserved for the overlay"
  open: "$1, open in a tab"
pageToast:
  free: is free
  putPageOnKey: Put this page on it
  switched: Switched to your open $1 tab
  openNew: Open new
  close: Close
options:
  loading: Loading your keys…
  search:
    label: Find a link, site or key
    placeholder: Find a link, site or key…
  holdHint:
    before: Hold
    after: anywhere to see your keys
  heading: Keymap
  subline:
    before: Press
    after: on any page to open its link.
    used: $1 of 35 keys in use.
  view:
    label: View
    keyboard: Keyboard
    list: List
  list:
    key: Key
    name: Name
    link: Link
    opensAs: Opens as
    closesCurrent: · closes current
    empty: No keys yet — pick one in Keyboard view
    noMatch: No keys match
  legend:
    assigned: Assigned
    selected: Selected
    free: Free
    open: Open in a tab right now
  inspector:
    label: Key details
    freeKey: Free key
    status: $1 + $2 · $3
    statusOpen: open in a tab now
    statusFree: paste a link to assign
    link: Link
    linkPlaceholder: Paste a link or type a site
    linkError: Enter a web address, like github.com or https://example.com.
    useTab: Use $1
    noWebPage: No web page open
    name: Name — shown in the overlay
    namePlaceholder: Taken from the page title
    whenPressed: When I press it
    recommended: Recommended
    tabMatchPrompt: Count a tab as “already open” when it shows
    closeCurrent: Close the tab I’m on afterwards
    clear: Clear key
    saved: Saved
    saveError: Couldn’t save
    try: Try $1
  openMode:
    smart:
      title: Smart switch
      description: Jump to the tab if it’s already open, otherwise open it in a new tab.
    new:
      title: New tab
      description: Always open a fresh tab next to this one.
    this:
      title: This tab
      description: Replace the page you’re looking at.
    bg:
      title: Background tab
      description: Open quietly and stay where you are.
  tabMatch:
    exact:
      title: This exact link
      hint: Only a tab with exactly $1 is reused.
    page:
      title: This page
      hint: "Reuses a tab on $1, ignoring ?query and #anchors."
    site:
      title: Any page of the site
      hint: Reuses any tab on $1 — e.g. a video you left open.
