extName: SpeedLink
extDescription: Put your sites on keys. Hold ⌥ (Alt) and press a key to open a site or jump to its tab.
commandToggleOverlay: Show or pin the shortcut overlay
platform:
  mac:
    trigger: ⌥ Option
    triggerWord: Option
    chord: ⌥$1
    plusKey: ⌥ + key
    plus: ⌥ +
    symbol: ⌥
    paste: ⌘V
  other:
    trigger: Alt
    triggerWord: Alt
    chord: Alt+$1
    plusKey: Alt + key
    plus: Alt +
    symbol: Alt
    paste: Ctrl+V
keyCap:
  assigned: "$1 $2: $3"
  free: "$1 $2: free"
  reserved: "$1 $2: reserved for the overlay"
  open: "$1, open in a tab"
